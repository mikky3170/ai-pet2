
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIペット クロちゃん🐾</title>

  <!-- PWA（スマホのホーム画面追加で本物のアプリ化）設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="クロちゃん🐾">
  <meta name="theme-color" content="#ffffff">

  <style>
    :root {
      --primary-color: #f472b6;
      --secondary-color: #38bdf8;
      --bubble-bg: rgba(255, 255, 255, 0.96);
      --text-color: #1f2937;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 背景を画像の白と100%同一化（四角い枠線を物理的に完全消滅） */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* メインコンテナ */
    #pet-container {
      position: absolute;
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 8px) 14px env(safe-area-inset-bottom, 14px) 14px;
      z-index: 50;
      box-sizing: border-box;
    }

    /* 1. 最上部ステータスバー */
    .top-header {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(248, 250, 252, 0.94);
      backdrop-filter: blur(8px);
      padding: 7px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-size: 11.5px;
      font-weight: bold;
      color: #4a5568;
      z-index: 20;
      margin-bottom: 6px;
    }

    .model-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
      transition: all 0.3s;
    }
    .model-badge.lite { background: #e0f2fe; color: #0284c7; }
    .model-badge.pro { background: #fdf4ff; color: #c026d3; }

    /* 2. 会話タイムライン */
    #chat-timeline {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 4px 6px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      z-index: 10;
    }

    #chat-timeline::-webkit-scrollbar { width: 4px; }
    #chat-timeline::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.35);
      border-radius: 4px;
    }

    .chat-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-row.user { justify-content: flex-end; }
    .chat-row.model { justify-content: flex-start; }

    .chat-bubble {
      max-width: 86%;
      padding: 9px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }
    .chat-row.user .chat-bubble {
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .chat-row.model .chat-bubble {
      background: #fdf2f8;
      color: #2d3748;
      border: 1.5px solid #fbcfe8;
      border-bottom-left-radius: 4px;
    }

    /* 3. クロちゃん本体（四角い枠ゼロ・ゆっくり息づく上品ステージ） */
    .pet-avatar-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      margin-bottom: -18px; /* 黒い操作台座に接地 */
    }

    /* 猫ちゃんのアニメーションコンテナ */
    #cat-stage-box {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform-origin: bottom center;
      transition: transform 0.4s ease-out;
    }

    /* 待機中：4.8秒かけてゆったり深呼吸 ＆ 穏やかな首かしげ */
    .pet-avatar-wrapper.is-idling #cat-stage-box {
      animation: catSlowCalmBreathe 4.8s ease-in-out infinite;
    }

    @keyframes catSlowCalmBreathe {
      0%, 100% { transform: scale(1, 1) translateY(0) rotate(0deg); }
      30% { transform: scale(1.018, 0.985) translateY(-4px) rotate(-1.5deg); }
      70% { transform: scale(1.018, 0.985) translateY(-4px) rotate(1.5deg); }
    }

    /* お話し中：点滅は絶対にせず、お口開けポーズのまま1.3秒周期で優しくふわりふわりと息づく */
    .pet-avatar-wrapper.is-talking #cat-stage-box {
      animation: catGentleTalkBreath 1.3s ease-in-out infinite alternate;
    }

    @keyframes catGentleTalkBreath {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-5px) scale(1.02); }
    }

    /* 考え中：2.6秒周期でゆっくり思索するように傾く */
    .pet-avatar-wrapper.is-thinking #cat-stage-box {
      animation: catSlowThinking 2.6s ease-in-out infinite alternate;
    }

    @keyframes catSlowThinking {
      0% { transform: scale(1) rotate(-3deg); }
      100% { transform: scale(1.015) rotate(3deg); }
    }

    /* 4枚のJPEG画像（GitHubから直接読み込み・0.4秒でス〜ッと優雅に溶け合うクロスフェード） */
    .cat-avatar-img {
      position: absolute;
      bottom: 0;
      height: 100%;
      max-height: 300px;
      object-fit: contain;
      object-position: bottom center;
      opacity: 0;
      pointer-events: none;
      transform-origin: bottom center;
      transition: opacity 0.4s ease-in-out;
      background: transparent !important;
    }

    /* 現在アクティブな画像 */
    .cat-avatar-img.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 接地シャドウ */
    .cat-ground-shadow {
      position: absolute;
      bottom: 15px;
      width: 250px;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 75%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    /* なでなで時の幸せリアクション */
    .pet-avatar-wrapper.is-stroked #cat-stage-box {
      animation: none !important;
      transform: scale(0.96) !important;
    }

    /* なでなでハート演出 */
    .heart-fx {
      position: absolute;
      color: #f43f5e;
      font-size: 34px;
      pointer-events: none;
      animation: float-heart 1.1s ease-out forwards;
      z-index: 25;
      bottom: 80px;
    }
    @keyframes float-heart {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 0.9; transform: translate(var(--rx), -50px) scale(1.2); }
      100% { opacity: 0; transform: translate(var(--rx), -100px) scale(1.4); }
    }

    /* 4. 最下部操作バー */
    .bottom-controls {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #111827;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      padding: 8px 12px;
      border-radius: 38px;
      transition: box-shadow 0.3s;
    }

    /* 音声認識待機中：台座全体が上品にグリーン発光 */
    .is-listening .action-bar {
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 18px rgba(34, 197, 94, 0.6), 0 0 0 1px rgba(74, 222, 128, 0.4) inset;
    }

    .btn-action {
      flex: 1;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #1f2937;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-action:active { transform: scale(0.97); background: #374151; }
    .btn-action.is-paused { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }

    .btn-circle {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      background: #1f2937;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      margin-left: 8px;
      transition: transform 0.15s, background 0.2s;
    }
    .btn-circle:active { transform: scale(0.92); background: #374151; }

    /* 5. 診断モニタ */
    #diag-panel {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 150;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }
    #diag-panel.expanded { display: flex; }

    .diag-modal-content {
      width: 100%;
      max-width: 500px;
      height: 60vh;
      background: #0f172a;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 11.5px;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .diag-header {
      background: #1e293b;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
    }
    .diag-close-btn {
      background: #334155;
      border: none;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .diag-logs {
      padding: 12px 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #cbd5e1;
    }
    .log-row { line-height: 1.45; word-break: break-all; }
    .log-success { color: #4ade80; }
    .log-warn { color: #facc15; }
    .log-error { color: #f87171; font-weight: bold; }
    .log-info { color: #94a3b8; }

    /* 6. 設定 ＆ 記憶帳モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 14px;
    }
    .modal-card {
      background: white;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .modal-card h3 {
      margin-top: 0;
      color: #1f2937;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: #4b5563;
      margin-bottom: 5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 13.5px;
      outline: none;
    }

    .voice-select-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-test-voice {
      flex-shrink: 0;
      padding: 9px 14px;
      background: #fdf2f8;
      border: 1.5px solid #fbcfe8;
      color: #be185d;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12.5px;
      cursor: pointer;
    }

    .memory-list {
      background: #f9fafb;
      border-radius: 14px;
      padding: 8px;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11.5px;
    }
    .memory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .memory-item span { flex: 1; word-break: break-all; color: #374151; }
    .memory-item button { background: none; border: none; color: #ef4444; cursor: pointer; }
    .memory-add-box { display: flex; gap: 6px; margin-top: 6px; }
    .memory-add-box input { flex: 1; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; }
    .memory-add-box button { background: var(--primary-color); color: white; border: none; border-radius: 8px; padding: 0 12px; font-weight: bold; }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #f472b6, #ec4899);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body>

  <div id="pet-container">
    <!-- 1. 最上部ステータスバー -->
    <div class="top-header">
      <span id="clock-display">00:00</span>
      <span id="status-text">👂 聴いてるニャ♪</span>
      <span id="pro-counter-display">🧠 3.8残: 20/20</span>
      <span id="model-badge" class="model-badge lite">⚡ 3.5 lite</span>
    </div>

    <!-- 2. 会話タイムライン -->
    <div id="chat-timeline">
      <div class="chat-row model">
        <div class="chat-bubble">
          おやびん、わたしはクロだニャ🐾 今日は何をお話しするニャン？
        </div>
      </div>
    </div>

    <!-- 3. 中央〜下部：クロちゃん本体（四角い枠ゼロ・ゆっくり息づく上品ステージ） -->
    <div class="pet-avatar-wrapper is-idling" id="avatar-wrapper" title="なでなでで喜ぶニャ！">
      <div class="cat-ground-shadow"></div>

      <!-- アニメーションステージ（ゆったりとしたスロー呼吸） -->
      <div id="cat-stage-box">
        <img src="idle.jpg" alt="待機中" class="cat-avatar-img active" id="img-idle">
        <img src="talking.jpg" alt="お話し中" class="cat-avatar-img" id="img-talking">
        <img src="thinking.jpg" alt="考え中" class="cat-avatar-img" id="img-thinking">
        <img src="happy.jpg" alt="大喜び" class="cat-avatar-img" id="img-happy">
      </div>
    </div>

    <!-- 4. 最下部操作バー -->
    <div class="bottom-controls">
      <div class="action-bar" id="action-bar">
        <button class="btn-action" id="pause-btn">
          <span id="pause-icon" style="font-size:18px;">🟢</span>
          <span id="pause-text">会話中（話しかけてニャ）</span>
        </button>

        <button class="btn-circle" id="settings-btn" title="声の選択・設定・記憶">⚙️</button>
        <button class="btn-circle" id="toggle-diag-btn" title="診断モニタを表示">🩺</button>
      </div>
    </div>
  </div>

  <!-- 5. 診断モニタ -->
  <div id="diag-panel">
    <div class="diag-modal-content">
      <div class="diag-header">
        <span>🩺 クロ システム診断モニタ</span>
        <button class="diag-close-btn" id="diag-close-btn">✕ 閉じる</button>
      </div>
      <div class="diag-logs" id="diag-logs">
        <div class="log-row log-info">[Init] システム起動。Google正規generateContent通信＆四国めたん完全連携完了ニャ！</div>
      </div>
    </div>
  </div>

  <!-- 6. 設定 ＆ 記憶帳モーダル -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ クロちゃんの設定・音声・記憶</h3>
      
      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>

      <!-- 📔 記憶帳 -->
      <div class="form-group">
        <label>📔 クロの記憶帳（忘れない長期記憶）:</label>
        <div class="memory-list" id="memory-list-container"></div>
        <div class="memory-add-box">
          <input type="text" id="new-memory-input" placeholder="新しい記憶（例: 趣味はドライブ）">
          <button id="add-memory-btn">追加</button>
        </div>
      </div>

      <!-- 🔊 音声選択 -->
      <div class="form-group">
        <label>クロのAI肉声ボイス（選んだ声で確実に会話）:</label>
        <div class="voice-select-row">
          <select id="voice-model-select">
            <option value="metan-ama">🌸 四国めたん（あまあま少女声・推奨）</option>
            <option value="zundamon-ama">🐱 ずんだもん（あまあま・子猫ボイス）</option>
            <option value="tsumugi">✨ 春日部つむぎ（元気でおしゃまな女の子）</option>
            <option value="zundamon-norm">🎀 ずんだもん（ノーマル少女声）</option>
          </select>
          <button type="button" class="btn-test-voice" id="test-voice-btn">🔊 試聴</button>
        </div>
      </div>

      <div class="form-group">
        <label>話すスピード: <span id="rate-val">1.05</span></label>
        <input type="range" id="voice-rate" min="0.8" max="1.3" step="0.05" value="1.05">
      </div>

      <button class="btn-save" id="save-settings-btn">設定と記憶を保存するニャン♪</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       ★ Android対応・永続アンロック済みHTML5オーディオプレーヤー
       ========================================================== */
    const masterAudio = new Audio();
    masterAudio.crossOrigin = "anonymous";
    let isMasterUnlocked = false;

    function unlockMasterAudio() {
      if (isMasterUnlocked) return;
      masterAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
      masterAudio.play().then(() => {
        isMasterUnlocked = true;
        logDiag("[Audio] スマホの音声再生権限をアンロック完了ニャ！", "info");
      }).catch(() => {});
    }
    window.addEventListener('pointerdown', unlockMasterAudio, { passive: true });
    window.addEventListener('touchstart', unlockMasterAudio, { passive: true });

    /* ==========================================================
       1. 音響エンジン（鳴き声＆喉鳴らし）
       ========================================================== */
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx && AudioContextClass) audioCtx = new AudioContextClass();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playCatMeow(type = 'normal') {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'triangle';
      filter.type = 'bandpass';
      filter.Q.value = 3.5;

      if (type === 'happy') {
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.42);
        filter.frequency.setValueAtTime(1100, now);
        filter.frequency.linearRampToValueAtTime(1600, now + 0.15);
        filter.frequency.linearRampToValueAtTime(1000, now + 0.42);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.28, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      } else {
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(820, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.25);
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.linearRampToValueAtTime(1500, now + 0.1);
        filter.frequency.linearRampToValueAtTime(900, now + 0.25);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }
    }

    function playCatPurr() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const bufferSize = ctx.sampleRate * 1.2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 110;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 26;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.35;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      lfo.connect(lfoGain.gain);
      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      whiteNoise.start(now);
      lfo.start(now);
      whiteNoise.stop(now + 1.2);
      lfo.stop(now + 1.2);
    }

    function handleMemoryVoiceCommand(text) {
      const rememberPatterns = [
        /(?:これ|このこと|次のこと)?(?:を)?(?:記憶帳|ノート)?(?:に)?(?:覚えて|登録して|記録して|メモして)[：:、\s]*(.+)/,
        /(.+?)(?:って|だと|と)?(?:覚えて|記憶して|ノートに書いて)/,
        /(?:ボク|私|わたし|俺|僕)の名前は\s*(.+?)(?:だ|です|だよ|ニャ)/
      ];

      for (const pattern of rememberPatterns) {
        const match = text.match(pattern);
        if (match && match[1]) {
          let content = match[1].trim();
          if (content.length > 1) {
            if (text.includes('名前は')) content = `飼い主さんの名前：${content}`;
            STATE.memories.push(content);
            localStorage.setItem('kuro_notebook_memories', JSON.stringify(STATE.memories));
            renderMemoryList();
            logDiag(`[音声自動記憶] 「${content}」`, 'success');
            return `了解ニャン！記憶帳に『${content}』ってしっかりメモしたニャ🐾 クロはずっと覚えてるニャ♪`;
          }
        }
      }

      if (text.includes('記憶帳見せて') || text.includes('何覚えてる') || text.includes('記憶帳教えて')) {
        const count = STATE.memories.length;
        const sample = STATE.memories.slice(-2).join('、');
        return `クロの記憶帳には全部で${count}個メモしてあるニャ！例えば「${sample}」などを覚えてるニャン🐾`;
      }
      return null;
    }

    function evaluateComplexity(promptText) {
      if (promptText.includes('3.8') || promptText.includes('サンテンハチ') || promptText.includes('本気で考えて')) {
        return { isPro: true, reason: "明示的指示" };
      }
      const complexKeywords = ['計算して', 'プログラミング', 'コード書いて', '違いを教えて', '比較して', '論理的', 'なぜなら', '理由を3つ', '考察', '歴史', '設計', '分析'];
      const hasComplexWord = complexKeywords.some(kw => promptText.includes(kw));
      const isLongPrompt = promptText.length >= 45;

      if (hasComplexWord || isLongPrompt) {
        return { isPro: true, reason: "高度な推論判定" };
      }
      return { isPro: false, reason: "日常会話・簡易照会" };
    }

    // ★重要修正：Geminiの「先頭は必ずuserでなければならない（400エラー原因）」を完全解決！
    async function sendToGeminiOfficialAPI(modelName, systemPrompt, promptText, historyItems) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${STATE.apiKey}`;

      const contents = [];
      // 履歴を追加するが、先頭は必ず 'user' から始まらなければならない（Googleルール遵守）
      let hasStartedUser = false;
      historyItems.forEach(h => {
        if (!hasStartedUser && h.role !== 'user') return; // 先頭のmodel挨拶をスキップ
        hasStartedUser = true;
        contents.push({
          role: h.role === 'user' ? 'user' : 'model',
          parts: [{ text: h.text }]
        });
      });

      // 現在のおやびんの発言（user）を追加
      contents.push({
        role: 'user',
        parts: [{ text: promptText }]
      });

      const bodyData = {
        system_instruction: {
          parts: [{ text: systemPrompt }]
        },
        contents: contents
      };

      const needsSearch = /(天気|気温|ニュース|最新|今何時|近くの|ラーメン|おすすめ|評判|株価|現在)/.test(promptText);
      if (needsSearch) {
        bodyData.tools = [{ googleSearch: {} }];
      }

      return await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
      });
    }

    function sanitizeModelText(text) {
      if (!text) return "";
      return text
        .replace(/[（\(【\[]?\s*\d{1,3}\s*文字(?:以内|程度)?\s*[）\)】\]]?/g, '')
        .replace(/[（\(][^）\)]*(?:文字数|カウント)[^）\)]*[）\)]/g, '')
        .replace(/[*#_~`]/g, '')
        .trim();
    }

      modelBadge.textContent = badgeName;
      logDiag(`[AI送信] モデル: ${chosenModel} / 質問: 「${promptText}」`, "info");

      const historyToSend = chosenModel === MODELS.pro ? STATE.history.slice(-16) : STATE.history.slice(-10);
      const now = new Date();
      const timeStr = `${now.getHours()}時${now.getMinutes()}分`;

あなたはノルウェージャンフォレストキャットの愛らしくて賢い女の子の子猫「クロ」（1歳）です。

【知識・思考統合リファレンス】

    function cleanTextForSpeech(text) {
      return sanitizeModelText(text)
        .replace(/```[\s\S]*?```/g, '')
        .replace(/<[^>]*>/g, '')
        .replace(/[\p{Extended_Pictographic}\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
        .replace(/[*#_~`🐾❤️💖✨🐱🥟🍜🎀]/g, '')
        .replace(/\n+/g, ' ')
        .trim();
    }

    function stopSpeaking() {
      STATE.isSpeaking = false;
      masterAudio.pause();
      masterAudio.removeAttribute('src');
      masterAudio.load();
      setEmotion('idle');
    }

    async function speakVoice(rawText) {
      stopSpeaking();
      unlockMasterAudio();

      STATE.isSpeaking = true;
      statusText.textContent = "🗣️ お話し中ニャ♪";
      setEmotion('talking');

      const textToSpeak = cleanTextForSpeech(rawText);
      logDiag(`[AI肉声取得] モデル: ${STATE.voiceModel} / 「${textToSpeak}」`, "info");

      // スピーカーID決定（四国めたん あまあま: 0, ずんだもん あまあま: 3, つむぎ: 8, ずんだもん ノーマル: 1）
      let speakerId = 0; // デフォルト四国めたん
      if (STATE.voiceModel === 'zundamon-ama') speakerId = 3;
      else if (STATE.voiceModel === 'tsumugi') speakerId = 8;
      else if (STATE.voiceModel === 'zundamon-norm') speakerId = 1;

      try {
        const encodedText = encodeURIComponent(textToSpeak);
        const directApiUrl = `https://api.tts.quest/v3/voicevox/synthesis?text=${encodedText}&speaker=${speakerId}`;

        // 1. 合成リクエスト送信
        const res = await fetch(directApiUrl);
        if (!res.ok) throw new Error(`HTTP error: ${res.status}`);

        const data = await res.json();
        const audioUrl = data.mp3DownloadUrl || data.wavDownloadUrl || data.audioUrl;
        if (!audioUrl) throw new Error("Audio URL is empty in response");

        // 2. サーバーのエンコード完了を0.6秒だけ穏やかに待機
        await new Promise(r => setTimeout(r, 600));

        // 3. アンロック済みのプレーヤーに直接渡して再生
        masterAudio.src = audioUrl;
        masterAudio.playbackRate = STATE.rate;

        masterAudio.onended = () => {
          STATE.isSpeaking = false;
          statusText.textContent = "👂 聴いてるニャ♪";
          setEmotion('idle');
          // 次の会話のためにクリーンにリフレッシュ！
          masterAudio.removeAttribute('src');
          masterAudio.load();
          setTimeout(() => {
            if (!STATE.isPaused && !STATE.isThinking) startListening();
          }, 350);
        };

        masterAudio.onerror = (e) => {
          logDiag(`[オーディオ再生リトライ中]`, "warn");
          setTimeout(() => {
            masterAudio.play().catch(() => {
              STATE.isSpeaking = false;
              setEmotion('idle');
            });
          }, 400);
        };

        await masterAudio.play();
        logDiag(`[AI肉声発声中] 四国めたん/選んだ声で再生成功ニャ！`, "success");

      } catch (err) {
        logDiag(`[AI肉声通信エラー] ${err.message}`, "error");
        STATE.isSpeaking = false;
        statusText.textContent = "👂 聴いてるニャ♪";
        setEmotion('idle');
        setTimeout(() => {
          if (!STATE.isPaused && !STATE.isThinking) startListening();
        }, 400);
      }
    }

    // 🔊 試聴ボタン
    testVoiceBtn.addEventListener('click', () => {
      unlockMasterAudio();
      STATE.voiceModel = voiceModelSelect.value;
      STATE.rate = parseFloat(voiceRate.value);
      playCatMeow('happy');
      const voiceName = voiceModelSelect.options[voiceModelSelect.selectedIndex].text;
      logDiag(`[試聴テスト] ${voiceName}`, "info");
      speakVoice("おやびん！クロの声はこれだニャン🐾 聞き取りやすいかニャ？");
    });

    /* ==========================================================
       9. 音声認識（常時待機）
       ========================================================== */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      recognition.onstart = () => {
        STATE.isListening = true;
        document.body.classList.add('is-listening');
        statusText.textContent = "👂 聴いてるニャ♪";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text.trim()) {
          logDiag(`[聞き取り] 「${text}」`, "success");
          askGemini(text);
        }
      };

      recognition.onerror = () => {
        stopListening();
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => { if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening(); }, 400);
        }
      };

      recognition.onend = () => {
        stopListening();
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => { if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening(); }, 300);
        }
      };
    }

    function startListening() {
      if (!recognition || STATE.isPaused || STATE.isThinking || STATE.isSpeaking) return;
      try { recognition.start(); } catch (e) {}
    }

    function stopListening() {
      STATE.isListening = false;
      document.body.classList.remove('is-listening');
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }
    }

    function togglePause() {
      unlockMasterAudio();
      STATE.isPaused = !STATE.isPaused;
      if (STATE.isPaused) {
        pauseBtn.classList.add('is-paused');
        pauseIcon.textContent = "🛑";
        pauseText.textContent = "お休み中（タップで再開）";
        statusText.textContent = "💤 お昼寝中";
        addChatMessage('model', "クロはお昼寝するニャ…💤 お話しする時はボタンを押してニャン♪");
        setEmotion('idle');
        stopListening();
        stopSpeaking();
      } else {
        pauseBtn.classList.remove('is-paused');
        pauseIcon.textContent = "🟢";
        pauseText.textContent = "会話中（話しかけてニャ）";
        addChatMessage('model', "起きたニャ！おやびん、いつでも声で呼んでニャ🐾");
        setEmotion('idle');
        playCatMeow('happy');
        startListening();
      }
    }

    /* ==========================================================
       10. 設定モーダル・初期化
       ========================================================== */
    pauseBtn.addEventListener('click', togglePause);

    voiceRate.addEventListener('input', (e) => {
      rateVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    settingsBtn.addEventListener('click', () => {
      unlockMasterAudio();
      document.getElementById('api-key-input').value = STATE.apiKey;
      voiceModelSelect.value = STATE.voiceModel;
      voiceRate.value = STATE.rate;
      rateVal.textContent = STATE.rate.toFixed(2);
      renderMemoryList();
      modalOverlay.style.display = 'flex';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.style.display = 'none';
    });

    // 設定保存ボタン
    saveSettingsBtn.addEventListener('click', () => {
      unlockMasterAudio();
      STATE.apiKey = document.getElementById('api-key-input').value.trim();
      STATE.voiceModel = voiceModelSelect.value;
      STATE.rate = parseFloat(voiceRate.value);

      localStorage.setItem('kuro_api_key', STATE.apiKey);
      localStorage.setItem('kuro_voice_model', STATE.voiceModel);
      localStorage.setItem('kuro_rate', STATE.rate);

      modalOverlay.style.display = 'none';
      const voiceName = voiceModelSelect.options[voiceModelSelect.selectedIndex].text;
      logDiag(`[設定保存完了] 音声を「${voiceName}」に確定しましたニャ！`, "success");

      // 保存完了は愛らしい猫の鳴き声でお知らせ
      playCatMeow('happy');
      addChatMessage('model', `おやびん、声を『${voiceName}』に設定したニャン🐾 話しかけてニャ♪`);
      setTimeout(() => {
        if (!STATE.isPaused) startListening();
      }, 500);
    });

    window.addEventListener('load', () => {
      initGPS();
      renderMemoryList();
      restoreChatTimeline();
      setEmotion('idle');
      logDiag("クロちゃん起動完了。Google公式規格・四国めたん待機中ニャ🐾", "success");
      setTimeout(() => {
        if (!STATE.isPaused) startListening();
      }, 1000);
    });
  </script>
</body>
</html>
