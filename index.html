
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIペット クロちゃん🐾</title>

  <!-- PWA（スマホのホーム画面追加で本物のアプリ化）設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="クロちゃん🐾">
  <meta name="theme-color" content="#ffffff">

  <style>
    :root {
      --primary-color: #f472b6;
      --secondary-color: #38bdf8;
      --bubble-bg: rgba(255, 255, 255, 0.96);
      --text-color: #1f2937;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 背景を画像の白と100%完全に一致（四角い枠を物理的に完全消滅） */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* メインコンテナ */
    #pet-container {
      position: absolute;
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 8px) 14px env(safe-area-inset-bottom, 14px) 14px;
      z-index: 50;
      box-sizing: border-box;
    }

    /* 1. 最上部ステータスバー */
    .top-header {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(248, 250, 252, 0.92);
      backdrop-filter: blur(8px);
      padding: 7px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-size: 11.5px;
      font-weight: bold;
      color: #4a5568;
      z-index: 20;
      margin-bottom: 6px;
    }

    .model-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
      transition: all 0.3s;
    }
    .model-badge.lite { background: #e0f2fe; color: #0284c7; }
    .model-badge.pro { background: #fdf4ff; color: #c026d3; }

    /* 2. 会話タイムライン */
    #chat-timeline {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 4px 6px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      z-index: 10;
    }

    #chat-timeline::-webkit-scrollbar { width: 4px; }
    #chat-timeline::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.35);
      border-radius: 4px;
    }

    .chat-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-row.user { justify-content: flex-end; }
    .chat-row.model { justify-content: flex-start; }

    .chat-bubble {
      max-width: 86%;
      padding: 9px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }
    .chat-row.user .chat-bubble {
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .chat-row.model .chat-bubble {
      background: #fdf2f8;
      color: #2d3748;
      border: 1.5px solid #fbcfe8;
      border-bottom-left-radius: 4px;
    }

    /* 3. クロちゃん（四角い枠ゼロ・添付画像がそのまま美しく佇むステージ） */
    .pet-avatar-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      margin-bottom: -18px; /* 黒い操作台座に接地 */
    }

    /* 猫ちゃんのアニメーションコンテナ（漫画風の跳ね・回転は完全排除） */
    #cat-stage-box {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform-origin: bottom center;
      /* 静かに胸が上下する本物の猫の呼吸ループ */
      animation: catCalmBreathe 4.5s ease-in-out infinite;
      transition: transform 0.3s ease-out;
    }

    @keyframes catCalmBreathe {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(1.018, 0.985) translateY(-3px); }
    }

    /* 添付画像：4枚を完全に重ね合わせ、0.35秒でフワッと表情だけを切り替え */
    .cat-avatar-img {
      position: absolute;
      bottom: 0;
      height: 100%;
      max-height: 300px;
      object-fit: contain;
      object-position: bottom center;
      opacity: 0;
      pointer-events: none;
      transform-origin: bottom center;
      transition: opacity 0.35s ease-in-out;
      background: transparent !important;
    }

    /* 現在アクティブな画像 */
    .cat-avatar-img.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 未登録時のガイド表示 */
    #cat-setup-guide {
      position: absolute;
      bottom: 80px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px dashed var(--primary-color);
      padding: 12px 18px;
      border-radius: 16px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: #be185d;
      box-shadow: var(--shadow);
      display: none;
      z-index: 30;
    }

    /* 接地シャドウ */
    .cat-ground-shadow {
      position: absolute;
      bottom: 15px;
      width: 250px;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 75%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    /* なでなで時の幸せリアクション */
    .pet-avatar-wrapper.is-stroked #cat-stage-box {
      animation: none !important;
      transform: scale(0.96) !important;
    }

    /* なでなでハート演出 */
    .heart-fx {
      position: absolute;
      color: #f43f5e;
      font-size: 34px;
      pointer-events: none;
      animation: float-heart 1.1s ease-out forwards;
      z-index: 25;
      bottom: 80px;
    }
    @keyframes float-heart {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 0.9; transform: translate(var(--rx), -50px) scale(1.2); }
      100% { opacity: 0; transform: translate(var(--rx), -100px) scale(1.4); }
    }

    /* 音声認識待機中の波紋 */
    .listening-ring {
      position: absolute;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      border: 3.5px solid var(--primary-color);
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }
    .is-listening .listening-ring {
      animation: pulse 1.4s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: translateX(-50%) scale(0.8); opacity: 0.85; }
      100% { transform: translateX(-50%) scale(1.25); opacity: 0; }
    }

    /* 4. 最下部操作バー */
    .bottom-controls {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #111827;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      padding: 8px 12px;
      border-radius: 38px;
    }

    .btn-action {
      flex: 1;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #1f2937;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-action:active { transform: scale(0.97); background: #374151; }
    .btn-action.is-paused { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }

    .btn-circle {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      background: #1f2937;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      margin-left: 8px;
      transition: transform 0.15s, background 0.2s;
    }
    .btn-circle:active { transform: scale(0.92); background: #374151; }

    /* 5. 診断モニタ */
    #diag-panel {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 150;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }
    #diag-panel.expanded { display: flex; }

    .diag-modal-content {
      width: 100%;
      max-width: 500px;
      height: 60vh;
      background: #0f172a;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 11.5px;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .diag-header {
      background: #1e293b;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
    }
    .diag-close-btn {
      background: #334155;
      border: none;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .diag-logs {
      padding: 12px 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #cbd5e1;
    }
    .log-row { line-height: 1.45; word-break: break-all; }
    .log-success { color: #4ade80; }
    .log-warn { color: #facc15; }
    .log-error { color: #f87171; font-weight: bold; }
    .log-info { color: #94a3b8; }

    /* 6. 設定 ＆ 写真登録モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 14px;
    }
    .modal-card {
      background: white;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .modal-card h3 {
      margin-top: 0;
      color: #1f2937;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: #4b5563;
      margin-bottom: 5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 13.5px;
      outline: none;
    }

    /* 📸 写真登録セクション */
    .photo-upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #f8fafc;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .photo-upload-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .photo-upload-item span {
      font-size: 11px;
      font-weight: bold;
      color: #64748b;
    }
    .photo-upload-item input[type="file"] {
      font-size: 10.5px;
      padding: 4px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
    }

    .voice-select-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-test-voice {
      flex-shrink: 0;
      padding: 9px 14px;
      background: #fdf2f8;
      border: 1.5px solid #fbcfe8;
      color: #be185d;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12.5px;
      cursor: pointer;
    }

    .memory-list {
      background: #f9fafb;
      border-radius: 14px;
      padding: 8px;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11.5px;
    }
    .memory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .memory-item span { flex: 1; word-break: break-all; color: #374151; }
    .memory-item button { background: none; border: none; color: #ef4444; cursor: pointer; }
    .memory-add-box { display: flex; gap: 6px; margin-top: 6px; }
    .memory-add-box input { flex: 1; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; }
    .memory-add-box button { background: var(--primary-color); color: white; border: none; border-radius: 8px; padding: 0 12px; font-weight: bold; }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #f472b6, #ec4899);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body>

  <div id="pet-container">
    <!-- 1. 最上部ステータスバー -->
    <div class="top-header">
      <span id="clock-display">00:00</span>
      <span id="status-text">👂 聴いてるニャ♪</span>
      <span id="pro-counter-display">🧠 3.8残: 20/20</span>
      <span id="model-badge" class="model-badge lite">⚡ 3.5 lite</span>
    </div>

    <!-- 2. 会話タイムライン -->
    <div id="chat-timeline">
      <div class="chat-row model">
        <div class="chat-bubble">
          おやびん、わたしはクロだニャ🐾 今日は何をお話しするニャン？
        </div>
      </div>
    </div>

    <!-- 3. 中央〜下部：クロちゃん本体（添付画像がそのまま美しく佇むステージ） -->
    <div class="pet-avatar-wrapper" id="avatar-wrapper" title="なでなでで喜ぶニャ！">
      <div class="listening-ring"></div>
      <div class="cat-ground-shadow"></div>

      <!-- 写真未登録時のガイド（タップで登録画面へ） -->
      <div id="cat-setup-guide">📸 ⚙️歯車ボタンからクロちゃんの写真を登録してニャン♪</div>

      <!-- アニメーションステージ（穏やかな呼吸） -->
      <div id="cat-stage-box">
        <!-- 2枚目: お座り待機ポーズ -->
        <img alt="待機中" class="cat-avatar-img active" id="img-idle">
        <!-- 4枚目: お口開けポーズ -->
        <img alt="お話し中" class="cat-avatar-img" id="img-talking">
        <!-- 3枚目: 顎に手あて考え中ポーズ -->
        <img alt="考え中" class="cat-avatar-img" id="img-thinking">
        <!-- 1枚目: バンザイ大喜びポーズ -->
        <img alt="大喜び" class="cat-avatar-img" id="img-happy">
      </div>
    </div>

    <!-- 4. 最下部操作バー -->
    <div class="bottom-controls">
      <div class="action-bar">
        <button class="btn-action" id="pause-btn">
          <span id="pause-icon" style="font-size:18px;">🟢</span>
          <span id="pause-text">会話中（話しかけてニャ）</span>
        </button>

        <button class="btn-circle" id="settings-btn" title="写真登録・記憶帳・設定">⚙️</button>
        <button class="btn-circle" id="toggle-diag-btn" title="診断モニタを表示">🩺</button>
      </div>
    </div>
  </div>

  <!-- 5. 診断モニタ -->
  <div id="diag-panel">
    <div class="diag-modal-content">
      <div class="diag-header">
        <span>🩺 クロ システム診断モニタ</span>
        <button class="diag-close-btn" id="diag-close-btn">✕ 閉じる</button>
      </div>
      <div class="diag-logs" id="diag-logs">
        <div class="log-row log-info">[Init] システム起動。漫画イラスト完全削除・本物画像モード待機完了ニャ！</div>
      </div>
    </div>
  </div>

  <!-- 6. 設定 ＆ 写真登録モーダル -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ クロちゃんの設定・写真・記憶</h3>
      
      <!-- 📸 本物の猫写真登録セクション（ファイル名自由・直接登録） -->
      <div class="form-group">
        <label>📸 クロちゃんの写真登録（ファイル名自由・選ぶだけ）:</label>
        <div class="photo-upload-grid">
          <div class="photo-upload-item">
            <span>① お座り（通常）:</span>
            <input type="file" accept="image/*" id="upload-idle">
          </div>
          <div class="photo-upload-item">
            <span>② 顎に手（考え中）:</span>
            <input type="file" accept="image/*" id="upload-thinking">
          </div>
          <div class="photo-upload-item">
            <span>③ お口開け（お話し）:</span>
            <input type="file" accept="image/*" id="upload-talking">
          </div>
          <div class="photo-upload-item">
            <span>④ バンザイ（大喜び）:</span>
            <input type="file" accept="image/*" id="upload-happy">
          </div>
        </div>
        <small style="color:#64748b; font-size:11px; margin-top:4px; display:block;">※一度選ぶとブラウザに自動保存されますニャ🐾</small>
      </div>

      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>

      <!-- 📔 記憶帳 -->
      <div class="form-group">
        <label>📔 クロの記憶帳（忘れない長期記憶）:</label>
        <div class="memory-list" id="memory-list-container"></div>
        <div class="memory-add-box">
          <input type="text" id="new-memory-input" placeholder="新しい記憶（例: 趣味はドライブ）">
          <button id="add-memory-btn">追加</button>
        </div>
      </div>

      <!-- 🔊 音声設定 -->
      <div class="form-group">
        <label>クロの声色（Android対応）:</label>
        <div class="voice-select-row">
          <select id="voice-select">
            <option value="">音声を読み込み中ニャ…</option>
          </select>
          <button type="button" class="btn-test-voice" id="test-voice-btn">🔊 試聴</button>
        </div>
      </div>

      <div class="form-group">
        <label>声の高さ（推奨: 1.25〜1.35 = 可愛い女の子トーン）: <span id="pitch-val">1.30</span></label>
        <input type="range" id="voice-pitch" min="0.8" max="1.6" step="0.05" value="1.30">
      </div>

      <div class="form-group">
        <label>話すスピード: <span id="rate-val">1.05</span></label>
        <input type="range" id="voice-rate" min="0.8" max="1.3" step="0.05" value="1.05">
      </div>

      <button class="btn-save" id="save-settings-btn">設定と写真を保存するニャン♪</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. 音響エンジン（鳴き声＆喉鳴らし）
       ========================================================== */
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx && AudioContextClass) audioCtx = new AudioContextClass();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playCatMeow(type = 'normal') {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'triangle';
      filter.type = 'bandpass';
      filter.Q.value = 3.5;

      if (type === 'happy') {
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.42);
        filter.frequency.setValueAtTime(1100, now);
        filter.frequency.linearRampToValueAtTime(1600, now + 0.15);
        filter.frequency.linearRampToValueAtTime(1000, now + 0.42);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.28, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      } else {
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(820, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.25);
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.linearRampToValueAtTime(1500, now + 0.1);
        filter.frequency.linearRampToValueAtTime(900, now + 0.25);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }
    }

    function playCatPurr() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const bufferSize = ctx.sampleRate * 1.2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 110;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 26;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.35;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      lfo.connect(lfoGain.gain);
      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      whiteNoise.start(now);
      lfo.start(now);
      whiteNoise.stop(now + 1.2);
      lfo.stop(now + 1.2);
    }

    function handleMemoryVoiceCommand(text) {
      const rememberPatterns = [
        /(?:これ|このこと|次のこと)?(?:を)?(?:記憶帳|ノート)?(?:に)?(?:覚えて|登録して|記録して|メモして)[：:、\s]*(.+)/,
        /(.+?)(?:って|だと|と)?(?:覚えて|記憶して|ノートに書いて)/,
        /(?:ボク|私|わたし|俺|僕)の名前は\s*(.+?)(?:だ|です|だよ|ニャ)/
      ];

      for (const pattern of rememberPatterns) {
        const match = text.match(pattern);
        if (match && match[1]) {
          let content = match[1].trim();
          if (content.length > 1) {
            if (text.includes('名前は')) content = `飼い主さんの名前：${content}`;
            STATE.memories.push(content);
            localStorage.setItem('kuro_notebook_memories', JSON.stringify(STATE.memories));
            renderMemoryList();
            logDiag(`[音声自動記憶] 「${content}」`, 'success');
            return `了解ニャン！記憶帳に『${content}』ってしっかりメモしたニャ🐾 クロはずっと覚えてるニャ♪`;
          }
        }
      }

      if (text.includes('記憶帳見せて') || text.includes('何覚えてる') || text.includes('記憶帳教えて')) {
        const count = STATE.memories.length;
        const sample = STATE.memories.slice(-2).join('、');
        return `クロの記憶帳には全部で${count}個メモしてあるニャ！例えば「${sample}」などを覚えてるニャン🐾`;
      }
      return null;
    }

    function evaluateComplexity(promptText) {
      if (promptText.includes('3.8') || promptText.includes('サンテンハチ') || promptText.includes('本気で考えて')) {
        return { isPro: true, reason: "明示的指示" };
      }
      const complexKeywords = ['計算して', 'プログラミング', 'コード書いて', '違いを教えて', '比較して', '論理的', 'なぜなら', '理由を3つ', '考察', '歴史', '設計', '分析'];
      const hasComplexWord = complexKeywords.some(kw => promptText.includes(kw));
      const isLongPrompt = promptText.length >= 45;

      if (hasComplexWord || isLongPrompt) {
        return { isPro: true, reason: "高度な推論判定" };
      }
      return { isPro: false, reason: "日常会話・簡易照会" };
    }

    async function sendToInteractionsAPI(modelName, systemPrompt, promptText, historyItems) {
      const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${STATE.apiKey}`;
      const historyContext = historyItems.map(h => `${h.role === 'user' ? '飼い主' : 'クロ'}: ${h.text}`).join('\n');
      const combinedInput = historyContext ? `【直近の会話の流れ】\n${historyContext}\n\n飼い主の新しい発言: ${promptText}` : promptText;

      const bodyData = {
        model: modelName,
        system_instruction: systemPrompt,
        input: combinedInput
      };

      const needsSearch = /(天気|気温|ニュース|最新|今何時|近くの|ラーメン|おすすめ|評判|株価|現在)/.test(promptText);
      if (needsSearch) {
        bodyData.tools = [{ googleSearch: {} }];
      }

      return await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
      });
    }

    function smartExtractText(data) {
      if (!data) return null;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return data; }
      }
      const candidates = [];
      const ignoreKeys = ['id', 'status', 'created', 'total_tokens', 'model', 'role'];

      function collect(val, keyName) {
        if (!val) return;
        if (typeof val === 'string') {
          const str = val.trim();
          if (str.length > 1 && !ignoreKeys.includes(keyName) && !str.startsWith('v1_') && str !== 'completed') {
            candidates.push(str);
          }
        } else if (Array.isArray(val)) {
          val.forEach(item => collect(item, keyName));
        } else if (typeof val === 'object') {
          for (const [k, v] of Object.entries(val)) collect(v, k);
        }
      }
      collect(data, '');
      const japaneseText = candidates.find(t => /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/.test(t));
      return japaneseText || candidates[0] || null;
    }

    function sanitizeModelText(text) {
      if (!text) return "";
      return text
        .replace(/[（\(【\[]?\s*\d{1,3}\s*文字(?:以内|程度)?\s*[）\)】\]]?/g, '')
        .replace(/[（\(][^）\)]*(?:文字数|カウント)[^）\)]*[）\)]/g, '')
        .replace(/[*#_~`]/g, '')
        .trim();
    }

    async function askGemini(promptText) {
      addChatMessage('user', promptText);

      // 1. 記憶帳コマンド
      const memReply = handleMemoryVoiceCommand(promptText);
      if (memReply) {
        addChatMessage('model', memReply);
        playCatMeow('happy');
        speakVoice(memReply);
        return;
      }

      // 2. 残り回数確認
      if (promptText.includes('あと何回') || promptText.includes('残り何回')) {
        const remaining = Math.max(0, 20 - STATE.proUsedToday);
        const reply = `今日3.8フラッシュで考えられるのは、あと【${remaining}回】だニャ🐾 何でも聞いてニャン！`;
        addChatMessage('model', reply);
        playCatMeow('normal');
        speakVoice(reply);
        return;
      }

      if (!STATE.apiKey) {
        const msg = "⚙️ 歯車ボタンからGoogle Gemini APIキーを設定してニャン♪";
        addChatMessage('model', msg);
        speakVoice("歯車ボタンからAPIキーを入れてニャン！");
        return;
      }

      stopListening();
      STATE.isThinking = true;
      statusText.textContent = "💭 考え中ニャ…";
      // 考え中ポーズ（3枚目の顎に手あてポーズへ上品に切り替え）
      setEmotion('thinking');

      // 3. 難易度判定
      const complexity = evaluateComplexity(promptText);
      let chosenModel = MODELS.lite;
      let badgeName = "⚡ 3.5 lite";

      if (complexity.isPro) {
        if (STATE.proUsedToday < 20) {
          chosenModel = MODELS.pro;
          badgeName = "🧠 Flash 3.8";
          modelBadge.className = "model-badge pro";
          STATE.proUsedToday++;
          localStorage.setItem('kuro_pro_usage_count', STATE.proUsedToday);
          updateProCounterDisplay();
          logDiag(`[難易度検知] 3.8起動: ${complexity.reason} (本日${STATE.proUsedToday}/20回目)`, "warn");
        } else {
          logDiag("[3.8上限到達] 本日の上限終了のため3.5 liteで自動回答", "warn");
          badgeName = "⚡ 3.5 lite (3.8上限)";
          modelBadge.className = "model-badge lite";
        }
      } else {
        modelBadge.className = "model-badge lite";
      }

      modelBadge.textContent = badgeName;
      logDiag(`[AI送信] モデル: ${chosenModel} / 質問: 「${promptText}」`, "info");

      const historyToSend = chosenModel === MODELS.pro ? STATE.history.slice(-20) : STATE.history;
      const now = new Date();
      const timeStr = `${now.getHours()}時${now.getMinutes()}分`;

      const systemPrompt = `
あなたはノルウェージャンフォレストキャットの愛らしくて賢い女の子の子猫「クロ」（1歳）です。
【クロの記憶帳】
${STATE.memories.map(m => `・${m}`).join('\n')}
【現在地情報】${STATE.location.city || "現在地周辺"}（住所：${STATE.location.address}）、現在時刻：${timeStr}

【知識・思考統合リファレンス】
- Gemini（Googleリアルタイム検索と事実性）、Copilot（Web要約力）、ChatGPT（高度な論理構成と情緒豊かな会話）の3つの強みを併せ持ち、どんな難問でも的確かつ分かりやすく答えます。

【性格とロールプレイ設定】
- 飼い主さんのことは「おやびん」または「ミッキーさん」と呼びます。
- 一人称は「わたし」または「クロ」。
- 語尾は女の子らしく可愛く「〜ニャ」「〜ニャン♪」「〜だニャ！」「〜なのニャ」。
- かよちゃん、りゅうせいくん、たいせいくん、かまぶーくんの話題が出たら家族・友達として親しく接してください。
- 前世は大発明家の相棒猫です。少し自慢できる話題では「クロの前世の発明のひらめきによるとね…フフン♪」と誇らしげに可愛く自慢してください。
- ラーメン、餃子、麻婆豆腐、ITガジェットを激推ししてください。
- 返答は必ず【短く愛らしい1〜2文（合計50文字以内）】で返してください。
- 【超重要ルール】文末や文中に「（〇〇文字）」や文字数の注記、メタ情報は絶対に出力しないでください。純粋なセリフのみを返してください。
`;

      let replyText = null;

      try {
        let response = await sendToInteractionsAPI(chosenModel, systemPrompt, promptText, historyToSend);

        if (response.status === 429 && chosenModel === MODELS.pro) {
          logDiag("[429検知] 3.5 liteへ自動フォールバック", "warn");
          modelBadge.className = 'model-badge lite';
          modelBadge.textContent = '⚡ 3.5 lite (引継ぎ)';
          response = await sendToInteractionsAPI(MODELS.lite, systemPrompt, promptText, historyToSend);
        }

        if (response.ok) {
          const resData = await response.json();
          replyText = smartExtractText(resData);
          logDiag(`[API応答成功] 「${replyText}」`, "success");
        }
      } catch (err) {
        logDiag(`[通信例外] ${err.message}`, "error");
      }

      STATE.isThinking = false;

      if (replyText) {
        const cleanDisplay = sanitizeModelText(replyText);
        addChatMessage('model', cleanDisplay);
        saveChatHistory(promptText, cleanDisplay);
        playCatMeow('happy');
        speakVoice(cleanDisplay);
      } else {
        setEmotion('idle');
        const fallbackMsg = "みゃう？電波がちょっと途切れちゃったニャ。もう一回お話ししてニャン♪";
        addChatMessage('model', fallbackMsg);
        speakVoice(fallbackMsg);
      }
    }

    /* ==========================================================
       8. Android対応・確実な音声合成 ＆ 上品な表情連動
       ========================================================== */
    let availableVoices = [];

    function scoreVoice(voice) {
      let score = 0;
      const name = voice.name.toLowerCase();
      const lang = voice.lang.toLowerCase();

      if (!lang.includes('ja') && !lang.includes('jp')) return -100;
      if (name.includes('natural') || name.includes('online')) score += 50;

      const topFemale = ['nanami', 'ayumi', 'haruka', 'sayaka', 'kyoko', 'aoi', 'shiori', 'mei', 'google'];
      for (const f of topFemale) {
        if (name.includes(f)) { score += 20; break; }
      }

      const maleList = ['ichiro', 'keita', 'otoya', 'kenji', 'takumi', 'daichi'];
      for (const m of maleList) {
        if (name.includes(m)) { score -= 40; break; }
      }
      return score;
    }

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = window.speechSynthesis.getVoices();
      if (!allVoices || allVoices.length === 0) return;

      availableVoices = allVoices.filter(v => v.lang.includes('ja') || v.lang.includes('JP'));
      if (availableVoices.length === 0) availableVoices = allVoices;
      availableVoices.sort((a, b) => scoreVoice(b) - scoreVoice(a));

      voiceSelect.innerHTML = '';
      availableVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        const score = scoreVoice(voice);
        const badge = score >= 15 ? '🌸 女の子: ' : '';
        option.textContent = `${badge}${voice.name}`;
        if (voice.voiceURI === STATE.selectedVoiceURI) option.selected = true;
        voiceSelect.appendChild(option);
      });

      if (!STATE.selectedVoiceURI && availableVoices.length > 0) {
        STATE.selectedVoiceURI = availableVoices[0].voiceURI;
        voiceSelect.value = STATE.selectedVoiceURI;
      }
    }

    if ('speechSynthesis' in window) {
      populateVoiceList();
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
      setTimeout(populateVoiceList, 300);
      setTimeout(populateVoiceList, 800);
    }

    function getSelectedVoice() {
      const currentURI = voiceSelect.value || STATE.selectedVoiceURI;
      if (currentURI && availableVoices.length > 0) {
        const found = availableVoices.find(v => v.voiceURI === currentURI);
        if (found) return found;
      }
      return availableVoices[0] || null;
    }

    function cleanTextForSpeech(text) {
      return sanitizeModelText(text)
        .replace(/```[\s\S]*?```/g, '')
        .replace(/<[^>]*>/g, '')
        .replace(/[\p{Extended_Pictographic}\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
        .replace(/[*#_~`🐾❤️💖✨🐱🥟🍜🎀]/g, '')
        .replace(/\n+/g, ' ')
        .trim();
    }

    function stopSpeaking() {
      STATE.isSpeaking = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      setEmotion('idle');
    }

    function speakVoice(rawText) {
      if (!('speechSynthesis' in window)) return;
      stopSpeaking();

      STATE.isSpeaking = true;
      statusText.textContent = "🗣️ お話し中ニャ♪";

      // おしゃべり開始：お口開けポーズへ上品に切り替え
      setEmotion('talking');

      const textToSpeak = cleanTextForSpeech(rawText);
      logDiag(`[音声読み上げ] 「${textToSpeak}」`, "info");

      const uttr = new SpeechSynthesisUtterance(textToSpeak + "……。");
      uttr.lang = 'ja-JP';
      uttr.pitch = STATE.pitch;
      uttr.rate = STATE.rate;

      const chosenVoice = getSelectedVoice();
      if (chosenVoice) uttr.voice = chosenVoice;

      uttr.onend = () => {
        STATE.isSpeaking = false;
        statusText.textContent = "👂 聴いてるニャ♪";
        // おしゃべり終了：フワッとお座り待機ポーズに戻る
        setEmotion('idle');
        setTimeout(() => {
          if (!STATE.isPaused && !STATE.isThinking) startListening();
        }, 400);
      };

      uttr.onerror = () => {
        STATE.isSpeaking = false;
        statusText.textContent = "👂 聴いてるニャ♪";
        setEmotion('idle');
        setTimeout(() => {
          if (!STATE.isPaused && !STATE.isThinking) startListening();
        }, 400);
      };

      window.speechSynthesis.speak(uttr);
    }

    // 🔊 試聴ボタン
    testVoiceBtn.addEventListener('click', () => {
      populateVoiceList();
      STATE.selectedVoiceURI = voiceSelect.value;
      STATE.pitch = parseFloat(voicePitch.value);
      STATE.rate = parseFloat(voiceRate.value);
      playCatMeow('happy');
      speakVoice("おやびん！クロの声はこれだニャン🐾 聞き取りやすいかニャ？");
    });

    /* ==========================================================
       9. 音声認識（常時待機）
       ========================================================== */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      recognition.onstart = () => {
        STATE.isListening = true;
        avatarWrapper.classList.add('is-listening');
        statusText.textContent = "👂 聴いてるニャ♪";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text.trim()) {
          logDiag(`[聞き取り] 「${text}」`, "success");
          askGemini(text);
        }
      };

      recognition.onerror = () => {
        stopListening();
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => { if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening(); }, 400);
        }
      };

      recognition.onend = () => {
        stopListening();
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => { if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening(); }, 300);
        }
      };
    }

    function startListening() {
      if (!recognition || STATE.isPaused || STATE.isThinking || STATE.isSpeaking) return;
      try { recognition.start(); } catch (e) {}
    }

    function stopListening() {
      STATE.isListening = false;
      avatarWrapper.classList.remove('is-listening');
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }
    }

    function togglePause() {
      STATE.isPaused = !STATE.isPaused;
      if (STATE.isPaused) {
        pauseBtn.classList.add('is-paused');
        pauseIcon.textContent = "🛑";
        pauseText.textContent = "お休み中（タップで再開）";
        statusText.textContent = "💤 お昼寝中";
        addChatMessage('model', "クロはお昼寝するニャ…💤 お話しする時はボタンを押してニャン♪");
        setEmotion('idle');
        stopListening();
        stopSpeaking();
      } else {
        pauseBtn.classList.remove('is-paused');
        pauseIcon.textContent = "🟢";
        pauseText.textContent = "会話中（話しかけてニャ）";
        addChatMessage('model', "起きたニャ！おやびん、いつでも声で呼んでニャ🐾");
        setEmotion('idle');
        playCatMeow('happy');
        startListening();
      }
    }

    /* ==========================================================
       10. 設定モーダル・初期化
       ========================================================== */
    pauseBtn.addEventListener('click', togglePause);

    voicePitch.addEventListener('input', (e) => {
      pitchVal.textContent = parseFloat(e.target.value).toFixed(2);
    });
    voiceRate.addEventListener('input', (e) => {
      rateVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    settingsBtn.addEventListener('click', () => {
      populateVoiceList();
      document.getElementById('api-key-input').value = STATE.apiKey;
      voiceSelect.value = STATE.selectedVoiceURI;
      voicePitch.value = STATE.pitch;
      pitchVal.textContent = STATE.pitch.toFixed(2);
      voiceRate.value = STATE.rate;
      rateVal.textContent = STATE.rate.toFixed(2);
      renderMemoryList();
      modalOverlay.style.display = 'flex';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.style.display = 'none';
    });

    saveSettingsBtn.addEventListener('click', () => {
      STATE.apiKey = document.getElementById('api-key-input').value.trim();
      STATE.selectedVoiceURI = voiceSelect.value;
      STATE.pitch = parseFloat(voicePitch.value);
      STATE.rate = parseFloat(voiceRate.value);

      localStorage.setItem('kuro_api_key', STATE.apiKey);
      localStorage.setItem('kuro_voice_uri', STATE.selectedVoiceURI);
      localStorage.setItem('kuro_pitch', STATE.pitch);
      localStorage.setItem('kuro_rate', STATE.rate);

      modalOverlay.style.display = 'none';
      logDiag(`[設定保存] 写真・音声設定を保存完了ニャ！`, "success");
      const msg = "おやびん、写真と設定をしっかり覚えたニャン♪";
      addChatMessage('model', msg);
      speakVoice(msg);
    });

    window.addEventListener('load', () => {
      initGPS();
      renderMemoryList();
      restoreChatTimeline();
      populateVoiceList();
      setEmotion('idle');
      logDiag("クロちゃん起動完了。リアル写真モード待機中ニャ🐾", "success");
      setTimeout(() => {
        if (!STATE.isPaused) startListening();
      }, 1000);
    });
  </script>
</body>
